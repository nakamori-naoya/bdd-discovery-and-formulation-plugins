version: 2
name: formulate-data-model
description: 対応する業務知識から既存のBDD付きRDB論理データモデルを反証し、確認済みの発見を同じ正式な定義へ更新する
inputs: [user_input, business_knowledge_paths, references, existing_logical_document_path, modeling_method]

requires:
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}

steps:
  - id: preflight-domain-knowledge
    script: scripts/domain_input.py
    purpose: 既存論理資料に対応する業務知識が1件以上明示され、既存の通常fileとして読めることを反証前に検査する
    needs: [business_knowledge_paths]
    provides: [validated_business_knowledge_paths]

  - id: challenge-persistence
    playbook: grill
    purpose: 既存論理資料の永続化上の主張へQA観点を当て、答えで残す事実・履歴・業務制約が変わる問いだけを確かめる
    needs: [user_input, validated_business_knowledge_paths, references, existing_logical_document_path]
    provides: [decisions, open_questions]

  - id: ground
    agent_work: invoking_agent
    purpose: 既存論理資料、依頼、決定、未決を根拠・仮説・未確認へ区別して保持する
    needs: [existing_logical_document_path, validated_business_knowledge_paths, decisions, open_questions]
    provides: [grounded_input]

  - id: deepen-scenarios
    skill: write-persistence-scenarios
    purpose: 業務シナリオを掲載順に再評価し、永続化が結果を左右する作成・更新・削除、履歴、保持、失敗時保証だけを永続化シナリオ、採否表、条件マトリクスへ深化させる
    needs: [existing_logical_document_path, grounded_input]
    provides: [revised_persistence_scenarios, scenario_selection, persistence_coverage, condition_matrix]

  - id: validate-scenarios
    script: scripts/scenario_matrix.py
    purpose: 条件マトリクスの構造契約を検査し、意味品質は採点しない
    needs: [condition_matrix]
    provides: [validation_report]

  - id: revise-logical-model
    skill: design-data-model
    purpose: 確認済みの発見を論理構造とBDDへ戻し、同一path更新へ渡す本文を作る
    needs: [existing_logical_document_path, revised_persistence_scenarios, scenario_selection, persistence_coverage, condition_matrix, validation_report, modeling_method, grounded_input]
    provides: [revised_logical_data_model, final_markdown, requested_output_path]

  - id: validate-immutable-structure
    script: scripts/immutable_model.py
    purpose: 全論理テーブルの分類、時刻、イベント追加専用という構造契約だけを検査する
    needs: [final_markdown]
    provides: [immutable_validation_report]

  - id: guard-logical-update
    script: scripts/update-guard.py
    purpose: 更新先が入力された既存論理資料と同じ実体であることを検査する
    needs: [existing_logical_document_path, requested_output_path, immutable_validation_report]
    provides: [update_target]

  - id: update-logical-document
    playbook: write-doc
    purpose: 深化済みBDDと論理モデルを既存資料と同じpathへ保存する
    input:
      document_type: rdb-logical-data-modeling
    needs: [final_markdown, validation_report, immutable_validation_report, update_target, references]
    provides: [updated_logical_document_path]
