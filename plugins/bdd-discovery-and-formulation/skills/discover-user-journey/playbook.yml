version: 2
name: discover-user-journey
description: 1人の主たるユーザーが1つの目的を達成するまでを発見し、接続した場面のBDD正本として初めて作る
inputs: [user_input, references, output_directory, name]

requires:
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}

steps:
  - id: settle
    playbook: grill
    purpose: 目的を持って始める役割と各役割の目的、主たるユーザー、開始地点、最終地点、完了条件、途中で関わる役割のうち、入力から分からず正本の骨格を左右する点を成果を左右する順に厳選して確かめる
    needs: [user_input, references]
    provides: [decisions, open_questions]

  - id: ground
    agent_work: invoking_agent
    purpose: 同じagentが依頼、参照資料、決定、未決を根拠・仮説・未確認へ区別して保持する
    needs: [decisions, open_questions]
    provides: [grounded_input]

  - id: select-journey
    agent_work: invoking_agent
    purpose: 同じagentが役割×目的の一覧から、今回作る1本と残りの順番を決める。一覧は作業記録であり正本へ書かない
    needs: [grounded_input]
    provides: [journey_set]

  - id: map-journey
    skill: map-user-journey
    purpose: 同じagentが同梱skillの判断規律でJourneyの該当を判定し、目的、両端、場面、状態の受け渡し、既知の分岐をJourney mapとして保持する
    needs: [grounded_input, journey_set]
    provides: [journey_map]

  - id: compose
    agent_work: invoking_agent
    purpose: 同じagentが主たるユーザーが観測できる場面の接続とBDD、条件マトリクス、完成本文を作る
    needs: [journey_map, grounded_input]
    provides: [scenario_draft, condition_matrix, final_markdown]

  - id: validate
    script: scripts/scenario.py
    purpose: 場面とBDDの構造契約を検査し、意味品質は採点しない
    needs: [scenario_draft, condition_matrix]
    provides: [validation_report]

  - id: document
    playbook: write-doc
    purpose: 同じagentが保持した検査済みの完成本文をtext materialとして渡し、Markdown正本を初めて1本保存する
    input:
      document_type: user-journey-bdd
    needs: [final_markdown, validation_report, output_directory, name, references]
    provides: [user_journey_bdd_path]
