version: 2
name: formulate-user-journey
description: 既存のユーザー目的達成BDDを反証し、確認済みの理解と未決を同じJourney資料へ戻して深化させる
inputs: [user_input, references, existing_user_journey_bdd_path]

requires:
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}

steps:
  - id: challenge
    playbook: grill
    purpose: 既存のJourney資料を根拠に目的、両端、接続、分岐、中断再開、役割移譲、完了条件を問い、答えで本文の変更が一つに決まる不明点を成果を左右する順に厳選して確認する
    needs: [user_input, references, existing_user_journey_bdd_path]
    provides: [decisions, open_questions]

  - id: ground
    agent_work: invoking_agent
    purpose: 同じagentが既存のJourney資料、依頼、決定、未決を根拠・仮説・未確認へ区別して保持する
    needs: [existing_user_journey_bdd_path, decisions, open_questions]
    provides: [grounded_input]

  - id: remap-journey
    skill: map-user-journey
    purpose: 同じagentが同梱skillの判断規律で、既存本文を既成事実として追認せずJourneyの該当を再判定し、目的、両端、場面、状態の受け渡し、分岐を再構成する
    needs: [existing_user_journey_bdd_path, grounded_input]
    provides: [journey_map]

  - id: revise
    agent_work: invoking_agent
    purpose: 同じagentが確認済みの発見と未決を既存本文へ戻し、場面草案、条件マトリクス、改訂本文を作る。更新先は既存のJourney資料と同じpathである
    needs: [existing_user_journey_bdd_path, journey_map, grounded_input]
    provides: [scenario_draft, condition_matrix, requested_output_path, final_markdown]

  - id: validate
    script: scripts/scenario.py
    purpose: 場面とBDDの構造契約を検査し、意味品質は採点しない
    needs: [scenario_draft, condition_matrix]
    provides: [validation_report]

  - id: guard-update
    script: scripts/update-guard.py
    purpose: 更新先が入力された既存のJourney資料と同じpathであることを検査する
    needs: [existing_user_journey_bdd_path, requested_output_path]
    provides: [update_target]

  - id: document
    playbook: write-doc
    purpose: 同じagentが保持した検査済みの改訂本文をtext materialとして渡し、既存のJourney資料と同じpathへ差し替える
    input:
      document_type: user-journey-bdd
    needs: [final_markdown, validation_report, update_target, references]
    provides: [updated_user_journey_bdd_path]
