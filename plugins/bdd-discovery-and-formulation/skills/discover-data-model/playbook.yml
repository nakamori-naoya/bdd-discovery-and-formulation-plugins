version: 2
name: discover-data-model
description: 対応する業務知識の正式な定義から一次データの保存表現と永続化の作成・更新・削除を発見し、BDDを含むRDB論理データモデル資料にする
inputs: [user_input, business_knowledge_paths, references, modeling_method, output_directory, name]

requires:
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}

steps:
  - id: preflight-domain-knowledge
    script: scripts/domain_input.py
    purpose: 対応する業務知識が1件以上明示され、既存の通常fileとして読めることを設計前に検査する
    needs: [business_knowledge_paths]
    provides: [validated_business_knowledge_paths]

  - id: settle
    playbook: grill
    purpose: 入力だけでは不明で記録する事実・履歴・保持・削除の骨格を左右する業務イベントと条件を成果を左右する順に厳選して利用者へ確かめる
    needs: [user_input, validated_business_knowledge_paths, references]
    provides: [decisions, open_questions]

  - id: ground
    agent_work: invoking_agent
    purpose: 同じagentが依頼、参照資料、決定、未決を根拠・仮説・未確認へ区別して保持する
    needs: [validated_business_knowledge_paths, decisions, open_questions]
    provides: [grounded_input]

  - id: explore
    skill: explore-events
    purpose: 同じagentが同梱skillの判断規律で、永続化の必要を生む業務イベントと関係する役割を時系列に洗い出す
    needs: [grounded_input]
    provides: [events, actors]

  - id: scenarios
    skill: write-persistence-scenarios
    purpose: 同じagentが業務シナリオを掲載順に棚卸しし、永続化が結果を左右する断面だけを永続化シナリオ、採否表、3操作の検討状況、条件マトリクスへ構成する
    needs: [events, actors, grounded_input]
    provides: [persistence_scenarios, scenario_selection, persistence_coverage, condition_matrix]

  - id: validate-scenarios
    script: scripts/scenario_matrix.py
    purpose: 条件マトリクスの構造契約を検査し、意味品質は採点しない
    needs: [condition_matrix]
    provides: [validation_report]

  - id: logical-model
    skill: design-data-model
    purpose: 同じagentが同梱skillの判断規律と選んだ手法で、検査済みシナリオから記録する事実とRDB論理構造を設計し完成本文を作る
    needs: [persistence_scenarios, scenario_selection, persistence_coverage, condition_matrix, validation_report, modeling_method, grounded_input]
    provides: [logical_data_model, final_markdown]

  - id: validate-immutable-structure
    script: scripts/immutable_model.py
    purpose: 全論理テーブルの分類、宣言した時刻、イベント追加専用という構造契約だけを検査し、設計の意味は採点しない
    needs: [final_markdown]
    provides: [immutable_validation_report]

  - id: document
    playbook: write-doc
    purpose: 同じagentが保持した論理モデルとBDDをtext materialとして渡し、rdb-logical-data-modelingの型で1本保存する
    input:
      document_type: rdb-logical-data-modeling
    needs: [final_markdown, validation_report, immutable_validation_report, output_directory, name, references]
    provides: [logical_document_path]
