version: 2
name: domain-bdd-formulation
description: コアドメインの既存資料をQA観点で反証し、新しい理解・BDD・未決を同じ資料へ戻して深化させる
instructions:
  execution:
    directive: stepsを上から順に実行し、コアドメインの既存資料だけを反証・検査・同一パス更新へ渡す

focus: domain
document_type: domain-rule
output_format: markdown
max_steps: 6
allow_background: false
examples_limits:
  rows: 10
  columns: 6

requires:
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}

contract:
  grounding_sources: [user_input, referenced_artifacts, grill_decisions]
  probe_dimensions: [同値分割, 境界値, 精度と単位, 条件組合せ, 状態遷移, イベント順序, 重複と再実行, 同時実行, アクターと権限, 悪用と不正, 時間, 規則変更と遡及, 失敗時保証, 不変条件]
  cleanup:
    delete_after_document: [scenario_draft, condition_matrix, material, validated_scenarios]
    preserve: [grounded_input, existing_domain_rule_path, updated_domain_rule_path]

requirements:
  input_grounded: true
  clarify_with_grill: true
  core_domain_only: true
  existing_document_required: true
  update_in_place: true
  create_new_document: false

steps:
  - id: challenge
    playbook: grill
    purpose: 既存資料を根拠にコアドメインをQA観点で問い、不明点と深掘りが必要な点を利用者へ1問ずつ確認して修正と未決を分ける
    provides: [decisions, open_questions]

  - id: ground
    script: scripts/ground.py
    purpose: 依頼、反証の対象にした既存資料、線引き、確かめた決定と未決を、根拠づけられた入力として1つに束ねる
    needs: [decisions, open_questions]
    provides: [grounded_input, existing_domain_rule_path, core_scope]

  - id: draft
    script: scripts/compose.sh
    purpose: 確認済みの発見を業務ルール・状態・BDDへ戻し、未決を未決のまま反映した改訂本文と条件マトリクスが揃っていることを確かめて1つの素材へ束ねる
    needs: [existing_domain_rule_path, core_scope, decisions, open_questions, grounded_input]
    provides: [material, scenario_draft, condition_matrix, requested_output_path]

  - id: validate
    script: scripts/scenario.py
    purpose: 前提・行い・結果の境界、曖昧語、長さ、表を検査する
    needs: [scenario_draft, condition_matrix, grounded_input]
    provides: [validated_scenarios]

  - id: guard-update
    script: scripts/update-guard.py
    purpose: 更新先が入力された既存資料と同じパスであり、新規資料を作らないことを検査する
    needs: [existing_domain_rule_path, requested_output_path, grounded_input]
    provides: [update_target]

  - id: document
    playbook: write-doc
    purpose: 検査済みBDDと確認済みの理解を、update_targetが指す既存domain-ruleと同じパスへ差し替える
    input:
      document_type: ${.document_type}
    needs: [material, validated_scenarios, update_target, grounded_input]
    provides: [updated_domain_rule_path]

  - id: cleanup
    script: scripts/cleanup.py
    purpose: 既存資料の差し替えを確認した後、contract.cleanupで削除候補にしたBDD草案、束ねた素材、検査用ファイルだけを削除し、入力資料と更新済みdomain-ruleを保持する
    needs: [scenario_draft, condition_matrix, material, validated_scenarios, grounded_input, existing_domain_rule_path, updated_domain_rule_path]
    provides: [cleanup_report]
