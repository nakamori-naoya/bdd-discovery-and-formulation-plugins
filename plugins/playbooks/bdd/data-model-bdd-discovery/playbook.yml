version: 2
name: data-model-bdd-discovery
description: 業務イベントから永続化の作成・更新・削除を発見し、BDDを含むRDB論理データモデル資料にする
inputs: [user_input, referenced_artifacts, output_directory, name]
instructions:
  execution:
    directive: stepsを上から順に実行し、永続化シナリオを確定してから論理データモデルと資料へ渡す

focus: data-model
document_type: rdb-logical-data-modeling
output_format: markdown
modeling:
  method: normalized
requires:
  - {plugin: domain-events, marketplace: bdd-discovery-and-formulation}
  - {plugin: grill, marketplace: grill}
  - {plugin: persistence-scenarios, marketplace: bdd-discovery-and-formulation}
  - {plugin: data-model, marketplace: bdd-discovery-and-formulation}
  - {plugin: write-doc, marketplace: write-doc}

contract:
  grounding_sources: [user_input, referenced_artifacts, grill_decisions]
  persistence_operations: [create, update, delete]
  scenario_roles: [actor, prior_state, business_event, condition, decision, result, next_state, persisted_fact, history, retention]

requirements:
  input_grounded: true
  clarify_with_grill: true

agent_work:
  owner: invoking_agent
  inputs: [user_input, referenced_artifacts, decisions, open_questions]
  produces: [grounded_input, events, actors, persistence_scenarios, persistence_coverage, condition_matrix, logical_bdd_scenarios, logical_data_model, final_markdown]
  validation:
    - {script: scripts/scenario_matrix.py, command: check, input: condition_matrix}
  delivery:
    provider: write-doc
    input_mapping: {material_kind: text, material_content: final_markdown}
  temporary_files:
    location: system_temporary_directory
    delete_only_after: document_saved
    preserve: [referenced_artifacts, logical_document_path]

steps:
  - id: settle
    playbook: grill
    purpose: 入力だけでは不明または深掘りが必要な、業務イベント、残す事実、履歴、保持、物理削除の条件を利用者へ1問ずつ確かめる
    needs: [user_input, referenced_artifacts]
    provides: [decisions, open_questions]

  - id: ground
    agent_work: invoking_agent
    purpose: 同じagentが依頼、参照資料、決定、未決を根拠・仮説・未確認へ区別して保持する
    needs: [decisions, open_questions]
    provides: [grounded_input]

  - id: explore
    agent_work: invoking_agent
    purpose: 同じagentが永続化の必要を生む業務イベントと関係する役割を抽出する
    needs: [grounded_input]
    provides: [events, actors]

  - id: scenarios
    agent_work: invoking_agent
    purpose: 同じagentが作成・更新・削除に関係する業務断面をBDDと条件マトリクスへ構成する
    needs: [events, actors, decisions, grounded_input]
    provides: [persistence_scenarios, persistence_coverage, condition_matrix]

  - id: validate-scenarios
    script: scripts/scenario_matrix.py
    purpose: 条件マトリクスの構造契約を検査し、意味品質は採点しない
    needs: [persistence_scenarios, condition_matrix]
    provides: [validation_report]

  - id: logical-model
    agent_work: invoking_agent
    purpose: 同じagentが検査済みシナリオから記録する事実とRDB論理構造を設計し完成本文を作る
    needs: [persistence_scenarios, persistence_coverage, condition_matrix, validation_report, grounded_input]
    provides: [logical_bdd_scenarios, logical_data_model, final_markdown]

  - id: document
    playbook: write-doc
    purpose: 同じagentが保持した論理モデルとBDDをtext materialとして渡し、rdb-logical-data-modelingの型で1本保存する
    input:
      document_type: ${.document_type}
    needs: [logical_bdd_scenarios, logical_data_model, final_markdown, validation_report, output_directory, name]
    provides: [logical_document_path]
