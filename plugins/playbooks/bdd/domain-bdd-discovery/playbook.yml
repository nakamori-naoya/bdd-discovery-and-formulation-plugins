# domain-bdd-discovery — コアドメインの業務知識を探求し、ドメインルールとして残す。
#
# **この playbook は個々の手順を知らない。** 何を、どの順で呼ぶかだけを持つ。
# 順番を変えたい・工程を差し替えたいときは、
# <repo>/.harness-plugins/domain-bdd-discovery.config.yml で上書きする。
version: 2
name: domain-bdd-discovery
description: 業務で起きる事実から、コアの業務ルールと代表BDDを共通理解にして1本の正本にする
inputs: [user_input, referenced_artifacts, output_directory, name]
instructions:
  execution:
    directive: stepsを上から順に実行し、needsを前工程のprovidesから受け取る
  material:
    directive: 洗い出した事実・線引き・決定・振る舞い断面を、確からしさを保ったまま素材へ束ねる

focus: domain
document_type: domain-rule
output_format: markdown
map_dir: bdd/discovery/domain

# 欠けていたら止める。黙って劣化した結果を出さない。
requires:
  - {plugin: domain-events, marketplace: bdd-discovery-and-formulation}
  - {plugin: core-domain, marketplace: bdd-discovery-and-formulation}
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}

# 下段どうしをつなぐ契約。playbook が持つ。
# 素材の役の名前だけを共有し、各工程は互いを見ずに自分の領分を決める。
contract:
  grounding_sources: [user_input, referenced_artifacts, grill_decisions]
  material_roles: [業務イベント, 担い手, 常に守られること, 移り変わり, 業務ルール, 拒む理由, 未決]
  confidence: [confirmed, assumed, unknown]
  behavior_slice: [業務目的, 起点役割, 協働役割, 事前状態, 業務イベント, 条件, 業務判断, 判断権者, 結果, 次状態, 引継ぎ, 後続イベント]

# 業務の正本は、作りを全部やめても残る範囲だけを持つ。
# 実装の関心を落とす工程を外せないようにする。
requirements:
  input_grounded: true
  clarify_with_grill: true
  exclude_implementation: true

# 認知判断は起動した同じagentが保持する。script間で意味をrelayしない。
agent_work:
  owner: invoking_agent
  inputs: [user_input, referenced_artifacts, decisions, open_questions]
  produces: [grounded_input, events, actors, core_scope, implementation_excluded, behavior_map, representative_bdd, condition_matrix, final_markdown]
  validation:
    - script: scripts/scenario_matrix.py
      command: check
      input: condition_matrix
  delivery:
    provider: write-doc
    input_mapping: {material_kind: text, material_content: final_markdown}
  temporary_files:
    location: system_temporary_directory
    delete_only_after: document_saved
    preserve: [referenced_artifacts, domain_rule_path]

# stepsは公開playbook、同一agentの認知工程、決定論的検査の宣言順を表す。
steps:
  - id: settle
    playbook: grill
    purpose: 入力だけでは不明または深掘りが必要な業務の事実、役割、決まりを利用者へ1問ずつ確かめ、決定と未決を残す
    needs: [user_input, referenced_artifacts]
    provides: [decisions, open_questions]

  - id: ground
    agent_work: invoking_agent
    purpose: 同じagentが依頼、参照資料、決定、未決を根拠・仮説・未確認へ区別して保持する
    needs: [decisions, open_questions]
    provides: [grounded_input]

  - id: explore
    agent_work: invoking_agent
    purpose: 同じagentが根拠から業務イベントと関係する役割を時系列に抽出する
    needs: [grounded_input]
    provides: [events, actors]

  - id: scope
    agent_work: invoking_agent
    purpose: 同じagentが業務の話に線を引き、コア・支援・汎用へ分けて実装の関心を除く
    needs: [events, grounded_input]
    provides: [core_scope, implementation_excluded]

  - id: record-behavior
    agent_work: invoking_agent
    purpose: 同じagentが代表的な振る舞いを事前状態・業務イベント・判断・次状態のBDDと条件マトリクスへ構成する
    needs: [events, actors, core_scope, decisions, grounded_input]
    provides: [behavior_map, representative_bdd, condition_matrix, final_markdown]

  - id: validate
    script: scripts/scenario_matrix.py
    purpose: 条件マトリクスの構造契約を検査し、意味品質は採点しない
    needs: [condition_matrix, representative_bdd]
    provides: [validation_report]

  - id: document
    playbook: write-doc
    purpose: 同じagentが保持した確認済みの理解と検査済みBDDをtext materialとして渡し、domain-rule正本を1本保存する
    input:
      document_type: ${.document_type}
    needs: [final_markdown, validation_report, output_directory, name]
    provides: [domain_rule_path]
