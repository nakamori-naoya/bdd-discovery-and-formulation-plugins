name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 自 repository は <workspace>/<自分の名前>、保守 tool の参照元 harness-tools と依存 provider は <workspace>/<repo 名> に置く。
      # scripts/validate.sh から見た兄弟の相対 path は ../<repo 名> になる。
      # 兄弟 repository は常に検証済みの main を取得し、PR 由来の ref を渡さない（未信頼のコードを実行する経路を作らない）。
      # 複数 repository を同時に更新するときは、harness-tools → provider → consumer の順に merge する。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ github.event.repository.name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/harness-tools
          ref: main
          path: harness-tools
      # 依存 provider: scripts/validate.sh が実配布物を必要とする grill と write-doc だけ。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/grill-plugins
          ref: main
          path: grill-plugins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/write-doc-plugins
          ref: main
          path: write-doc-plugins
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
      - name: Install CLI requirements
        shell: bash
        run: bash harness-tools/ci/install-requirements.sh
      - name: Validate
        shell: bash
        run: bash harness-tools/ci/validate.sh "$GITHUB_WORKSPACE/${{ github.event.repository.name }}"
